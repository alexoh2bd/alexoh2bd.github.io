{{ define "main" }}
<div class="page page--simple">
  <main class="content content--wide">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Content }}
    <div class="post-body">
      {{ . }}
    </div>
    {{ end }}
    {{ if .Pages }}
    <ul class="blog-list" style="margin-top: 1.5rem">
      {{ range .Pages.ByTitle }}
      <li>
        <a class="blog-row" href="{{ .Permalink }}">
          <h3 class="blog-row-title">{{ .Title }}</h3>
        </a>
      </li>
      {{ end }}
    </ul>
    {{ end }}
  </main>
</div>
{{ end }}
