{{ define "main" }}
<div class="page page--simple">
  <main class="content content--wide">
    {{ if eq .Section "projects" }}
    <a class="back-link" href="{{ "/projects/" | relURL }}">← All projects</a>
    {{ end }}
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
      </header>
      <div class="post-body">
        {{ .Content }}
      </div>
    </article>
  </main>
</div>
{{ end }}
