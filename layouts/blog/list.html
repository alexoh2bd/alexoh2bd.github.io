{{ define "main" }}
<div class="page page--simple">
  <main class="content content--wide">
    <h1 class="page-title">Blog</h1>
    <ul class="blog-list">
      {{ range .Pages.ByDate.Reverse }}
      <li>
        <a class="blog-row" href="{{ .Permalink }}">
          <h3 class="blog-row-title">{{ .Title }}</h3>
          <time class="blog-row-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
          {{ with .Params.excerpt }}<p class="blog-row-excerpt">{{ . }}</p>{{ end }}
        </a>
      </li>
      {{ end }}
    </ul>
  </main>
</div>
{{ end }}
