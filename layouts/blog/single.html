{{ define "main" }}
<div class="page page--simple">
  <main class="content content--wide">
    <a class="back-link" href="{{ "/blog/" | relURL }}">← All posts</a>
    <article class="post">
      <header class="post-header">
        <h1 class="post-title">{{ .Title }}</h1>
        <p class="post-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
        {{ with .Params.report_link }}
        <p class="report-callout">
          <a class="report-link" href="{{ . }}" rel="noopener noreferrer" target="_blank">{{ $.Params.report_label | default "Full report →" }}</a>
        </p>
        {{ end }}
      </header>
      <div class="post-body">
        {{ .Content }}
      </div>
    </article>
  </main>
</div>
{{ end }}
