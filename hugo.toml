  description = "Alex Oh — research and projects."
  bio = "My personal mission is to build AI systems that genuinely understand the world and interact with their environment responsibly. My research sits at the intersection of self-supervised learning, reinforcement learning, and AI safety: three areas I see as deeply connected. I study how models can learn structured world representations through JEPA architectures, and how RL agents can act reliably within them."
